services:
  server:
    image: ghcr.io/whitedns/xdns-server:${XDNS_IMAGE_TAG:-latest}
    container_name: xdns-server
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      XDNS_DOMAIN: ${XDNS_DOMAIN:-}
      XDNS_METRICS_ADDRESS: 127.0.0.1:9090
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
